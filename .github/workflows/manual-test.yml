name: Run Test

# This workflow allows manual triggering of tests with customizable presets, hardware targets, and directories.
# It builds the Docker image and project, sets up test parameters, and runs tests using the specified configuration.

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite preset options or custom'
        required: true
        type: choice
        options:
          - 'basic-test.json'
          - 'basic-test-nightly.json'
          - 'basic-test-nightly-experimental.json'
          - 'model-test-push.json'
          - 'model-test-full.json'
          - 'on-pr.json'
          - 'schedule-nightly.json'
          - 'model-test-passing.json'
          - 'model-test-xfail.json'
          - 'model-test-experimental.json'
          - 'model-test-training-xfail-weekly.json'
          - 'model-test-extended.json'
          - 'full-mlir-uplift-qualification.json'
          - 'model-test-passing-weekly.json'
          - 'model-test-weekly.json'
          - 'vllm-model-tests.json'
          - 'vllm-model-tests-nightly.json'
          - 'fusion-tests.json'
          - 'model-test-lb-blackhole-nightly.json'
          - 'model-test-lb-blackhole-weekly.json'
          - 'model-test-emitpy.json'
          - 'basic-multihost-test.json'
          - 'Custom'
      test_suite_custom:
        description: 'Custom test suite json'
        required: false
        type: string
      mlir_override:
        description: 'Git SHA of commit in tenstorrent/tt-mlir'
        required: false
        type: string
      forge_models_override:
        description: 'Git SHA of commit (or branch name) in tenstorrent/tt-forge-models'
        required: false
        type: string
      manylinux_build:
        description: 'Build and use manylinux wheel'
        required: false
        type: boolean
        default: false
      torchxla_build_run_id:
        description: 'Manual torch-xla build run ID'
        required: false
        type: string
        default: ''
      artifact_sha:
        description: 'tt-xla commit SHA to reuse pre-built artifacts from instead of building (leave empty to build fresh)'
        required: false
        type: string
      dump_irs:
        description: 'Pass --dump-irs to pytest and upload collected IRs as artifacts'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  packages: write
  checks: write
  contents: read

run-name: 'Test ( Suite: ${{ inputs.test_suite }} )'

jobs:
  build-image:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
    with:
      mlir_override: ${{ inputs.mlir_override }}
      dockbuild: ${{ inputs.manylinux_build && 'all' || 'ci' }}

  build-ttxla:
    needs: build-image
    uses: ./.github/workflows/call-build.yml
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      docker_image_manylinux: ${{ needs.build-image.outputs.docker-image-manylinux }}
      mlir_override: ${{ inputs.mlir_override }}
      build_types: ${{ format('release{0}{1}', inputs.dump_irs && ',explorer' || '', inputs.manylinux_build && ',manylinux' || '') }}
      artifact_sha: ${{ inputs.artifact_sha }}

  test:
    if: always() && !cancelled() && !failure() && inputs.preset != 'tt_forge_models'
    uses: ./.github/workflows/call-test.yml
    needs: [ build-image, build-ttxla ]
    secrets: inherit
    with:
      test_suite: ${{ inputs.test_suite }}
      test_suite_custom: ${{ inputs.test_suite_custom }}
      docker_image: ${{ needs.build-image.outputs.docker-image-base }}
      artifact_release_run_id: ${{ inputs.manylinux_build && github.run_id || needs.build-ttxla.outputs.artifacts_run_id }}
      artifact_suffix: ${{ needs.build-ttxla.outputs.artifact_suffix }}
      wheel_build: ${{ inputs.manylinux_build && 'manylinux' || 'release' }}
      torchxla_build_run_id: ${{ inputs.torchxla_build_run_id }}
      forge_models_override: ${{ inputs.forge_models_override }}
      dump_irs: ${{ inputs.dump_irs }}

  # After a vLLM Run Test finishes, run the vllm-nightly-log Claude skill with
  # this workflow's run ID and publish model outputs to the job summary.
  # Use this to validate the skill before wiring it into schedule-nightly.yml.
  vllm-nightly-log-report:
    name: "vLLM nightly model outputs"
    needs: [ test ]
    if: >-
      always()
      && needs.test.result != 'cancelled'
      && (inputs.test_suite == 'vllm-model-tests-nightly.json'
          || inputs.test_suite == 'vllm-model-tests.json')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run vllm-nightly-log skill via Claude
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BENCHMARK_CI }}
        run: |
          mkdir -p vllm-nightly-logs
          # NOTE: `--allowed-tools` is variadic and would absorb the prompt arg;
          # use `--` to terminate options before the positional prompt.
          # `< /dev/null` suppresses the 3s stdin-wait warning when running headless.
          claude --print \
                 --permission-mode bypassPermissions \
                 --model claude-opus-4-7 \
                 --max-turns 30 \
                 --allowed-tools "Bash(gh api:*),Bash(gh auth:*),Bash(gh run view:*),Bash(gh run list:*),Bash(python:*),Bash(python3:*),Bash(mkdir:*),Bash(ls:*),Read,Write,Glob,Grep" \
                 -- \
                 "$(cat <<'PROMPT'
          Use the `vllm-nightly-log` skill at
          `.claude/skills/vllm-nightly-log/SKILL.md` for run ID
          `${{ github.run_id }}`.

          The run ID is already provided — do NOT ask for it. Skip the
          interactive run-ID question and proceed immediately.

          Read the SKILL.md and follow it exactly. The skill will:
            - confirm `gh` auth
            - run
              `.claude/skills/vllm-nightly-log/scripts/extract_vllm_outputs.py`
              with run ID `${{ github.run_id }}` and write the log to
              `vllm-nightly-logs/vllm-nightly-${{ github.run_id }}.log`
            - summarize how many vLLM jobs / outputs were captured

          After the log file is written, stop. Do NOT post GitHub comments,
          create issues, or modify any files outside `vllm-nightly-logs/`.
          PROMPT
          )" < /dev/null

      - name: Append log to job summary
        run: |
          LOG="vllm-nightly-logs/vllm-nightly-${{ github.run_id }}.log"
          if [ ! -f "$LOG" ]; then
            ALT="vllm-nightly-${{ github.run_id }}.log"
            if [ -f "$ALT" ]; then
              mkdir -p vllm-nightly-logs
              mv "$ALT" "$LOG"
            else
              echo "::error::No vLLM nightly log was produced for run ${{ github.run_id }}"
              exit 1
            fi
          fi
          {
            echo "## vLLM nightly model outputs"
            echo
            echo "Produced by \`.claude/skills/vllm-nightly-log\` for run \`${{ github.run_id }}\`."
            echo
            echo '```text'
            cat "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vllm-nightly-log-${{ github.run_id }}
          path: vllm-nightly-logs/
          retention-days: 90
          if-no-files-found: warn

  process-irs:
    # Only when dump_irs was requested — otherwise there are no ir-dumps-*
    # artifacts and check_dumped_irs fails on `gh run download`.
    if: always() && !cancelled() && inputs.dump_irs
    uses: ./.github/workflows/call-process-dumped-irs.yml
    needs: [ build-image, test ]
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      dumped_irs_run_id: ${{ github.run_id }}
