name: Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      mlir_override:
        description: 'Git SHA of commit in tenstorrent/tt-mlir'
        required: false
        type: string
      test_filter:
        description: "Optional pytest -k expression to narrow the selection by test name (e.g. 'resnet' or 'resnet or vit')"
        required: false
        type: string
      runs-on-filter:
        description: "Architecture you want to run the tests on"
        required: false
        type: choice
        options:
          - All
          - n150-perf
          - p150-perf
          - n300-llmbox
          - galaxy-wh-6u
          - qb2-blackhole
        default: n150-perf
      regression_check:
        description: "Enable perf metrics regression testing"
        required: false
        type: boolean
        default: false
      sh-runner:
        description: "Run on shared runner"
        required: false
        type: boolean
        default: true
      torchxla_build_run_id:
        description: 'Manual torch-xla build run ID'
        required: false
        type: string
        default: ''
      manylinux_build:
        description: 'Build and use manylinux wheel'
        required: false
        type: boolean
        default: false
      check_fusions:
        description: "Verify expected fusion ops are present in compiled IR"
        required: false
        type: boolean
        default: false


permissions:
  packages: write
  checks: write
  contents: write
  id-token: write
  actions: write

jobs:
  docker-build:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
    with:
      mlir_override: ${{ inputs.mlir_override }}
      dockbuild: ${{ inputs.manylinux_build && 'all' || 'ci' }}

  build:
    needs: docker-build
    uses: ./.github/workflows/call-build.yml
    secrets: inherit
    with:
      mlir_override: ${{ inputs.mlir_override }}
      docker_image: ${{ needs.docker-build.outputs.docker-image }}
      docker_image_manylinux: ${{ needs.docker-build.outputs.docker-image-manylinux }}
      build_types: ${{ inputs.manylinux_build && 'release,manylinux' || 'release' }}

  set-inputs:
    runs-on: ubuntu-latest
    steps:
    - name: Job summary
      shell: bash
      run: |
        # Manual runs always use the perf (nightly) lane; the arch choice restricts hardware
        # and test_filter narrows by test name via pytest -k.
        echo "### Perf benchmarks inputs" >> $GITHUB_STEP_SUMMARY
        echo "Test filter (-k): ${{ inputs.test_filter }}" >> $GITHUB_STEP_SUMMARY
        echo "Runs-on filter: ${{ inputs.runs-on-filter }}" >> $GITHUB_STEP_SUMMARY
        echo "Perf regression check: ${{ inputs.regression_check }}" >> $GITHUB_STEP_SUMMARY
        echo "Wheel type: ${{ inputs.manylinux_build && 'manylinux' || 'release' }}" >> $GITHUB_STEP_SUMMARY

  run-perf-benchmarks:
    needs: [docker-build, set-inputs, build]
    if: ${{ !cancelled() && needs.set-inputs.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    secrets: inherit
    uses: ./.github/workflows/call-filtered-perf-tests.yml
    with:
      lane: nightly
      hardware: ${{ inputs.runs-on-filter == 'All' && '' || inputs.runs-on-filter }}
      test_filter: ${{ inputs.test_filter }}
      docker_image: ${{ needs.docker-build.outputs.docker-image }}
      artifact_release_run_id: ${{ needs.build.outputs.artifacts_run_id }}
      artifact_suffix: ${{ needs.build.outputs.artifact_suffix }}
      torchxla_build_run_id: ${{ inputs.torchxla_build_run_id }}
      regression_check: ${{ inputs.regression_check || false }}
      sh-runner: ${{ inputs.sh-runner || false }}
      wheel_build: ${{ inputs.manylinux_build && 'manylinux' || 'release' }}
      check_fusions: ${{ inputs.check_fusions }}

  fail-notify:
    if: always()
    needs:
      - run-perf-benchmarks
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.check.outputs.failure }}
    steps:
      - name: Check if the needed jobs succeeded or failed
        id: check
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
