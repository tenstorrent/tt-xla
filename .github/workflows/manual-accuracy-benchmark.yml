name: Accuracy Benchmark

# Manually triggered TOP1/TOP5 token-accuracy sweep.
#
# Runs the `*_accuracy` matrix entries, which pass --accuracy-testing to pytest.
# That makes the benchmark teacher-force against reference tokens and emit
# top1_accuracy_p5 / top5_accuracy_p5 / top1_accuracy_mean / top5_accuracy_mean
# into the perf report, on top of the usual samples-per-second and PCC numbers.
# The plain Performance Benchmark workflow pins accuracy-testing to false, so it
# can never produce these.
#
# Pair it with `mlir_override` to A/B a tt-mlir change on accuracy, the same way
# Performance Benchmark is used to A/B on throughput.

on:
  # Dispatch is only selectable once this file reaches the default branch. Until
  # then the push trigger below is what runs it, straight off the topic branch.
  workflow_dispatch:
    inputs:
      mlir_override:
        description: 'Git SHA of commit in tenstorrent/tt-mlir'
        required: false
        type: string
      runs-on-filter:
        description: "Architecture you want to run the tests on"
        required: false
        type: choice
        options:
          - All
          - n150-perf
          - p150-perf
          - qb2-blackhole
          - galaxy-wh-6u
        default: n150-perf
      test_filter:
        description: "Only run models whose name contains one of these (case insensitive, comma separated, e.g. 'qwen,falcon3-7b'). Empty runs the whole accuracy set."
        required: false
        type: string
      exclude_filter:
        description: "Drop models whose name contains one of these (comma separated). Default drops google_gemma-2-2b-it, the one accuracy entry with no non-accuracy perf counterpart to compare against."
        required: false
        type: string
        default: gemma-2-2b
      regression_check:
        description: "Fail on >5% drop in TOP1/TOP5 vs the stored baseline"
        required: false
        type: boolean
        default: false
      skip-device-perf:
        description: "Skip device performance measurement"
        required: false
        type: boolean
        default: true
      sh-runner:
        description: "Run on shared runner"
        required: false
        type: boolean
        default: true
      torchxla_build_run_id:
        description: 'Manual torch-xla build run ID'
        required: false
        type: string
        default: ''
      manylinux_build:
        description: 'Build and use manylinux wheel'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - bmalesevic/revert-benchmark-ci-model-cleanup
    paths:
      # Bumping TT_MLIR_VERSION in third_party/CMakeLists.txt is the A/B knob
      # when dispatch is unavailable: it is the same value mlir_override
      # substitutes for, and a new commit means a new artifact_suffix, so the
      # build is never served from another revision's cache.
      - third_party/CMakeLists.txt
      - .github/workflows/manual-accuracy-benchmark.yml

permissions:
  packages: write
  checks: write
  contents: write
  id-token: write
  actions: write

jobs:
  docker-build:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
    with:
      mlir_override: ${{ inputs.mlir_override }}
      dockbuild: ${{ inputs.manylinux_build && 'all' || 'ci' }}

  build:
    needs: docker-build
    uses: ./.github/workflows/call-build.yml
    secrets: inherit
    with:
      mlir_override: ${{ inputs.mlir_override }}
      docker_image: ${{ needs.docker-build.outputs.docker-image }}
      docker_image_manylinux: ${{ needs.docker-build.outputs.docker-image-manylinux }}
      build_types: ${{ inputs.manylinux_build && 'release,manylinux' || 'release' }}

  set-inputs:
    runs-on: ubuntu-latest
    outputs:
      filter: ${{ steps.cfg.outputs.filter }}
      skip_device_perf: ${{ steps.cfg.outputs.skip_device_perf }}
      regression_check: ${{ steps.cfg.outputs.regression_check }}
      sh_runner: ${{ steps.cfg.outputs.sh_runner }}
    steps:
    - name: Resolve inputs and build filter
      id: cfg
      shell: bash
      env:
        IN_RUNNER: ${{ inputs.runs-on-filter }}
        IN_TEST_FILTER: ${{ inputs.test_filter }}
        IN_EXCLUDE: ${{ inputs.exclude_filter }}
        IN_SKIP_DEVICE_PERF: ${{ inputs.skip-device-perf }}
        IN_REGRESSION: ${{ inputs.regression_check }}
        IN_SH_RUNNER: ${{ inputs.sh-runner }}
      run: |
        # A push event carries no `inputs` context, so every IN_* above is "".
        # Branch on the event rather than defaulting with `||` in a GitHub
        # expression: `${{ inputs.sh-runner || true }}` would also rewrite an
        # explicit false on a dispatch.
        if [ "${{ github.event_name }}" = "push" ]; then
          RUNNER=n150-perf
          TEST_FILTER=""
          EXCLUDE=gemma-2-2b
          SKIP_DEVICE_PERF=true
          REGRESSION=false
          SH_RUNNER=true
        else
          RUNNER="$IN_RUNNER"
          TEST_FILTER="$IN_TEST_FILTER"
          EXCLUDE="$IN_EXCLUDE"
          SKIP_DEVICE_PERF="$IN_SKIP_DEVICE_PERF"
          REGRESSION="$IN_REGRESSION"
          SH_RUNNER="$IN_SH_RUNNER"
        fi

        # Build the advanced filter. "accuracy-testing": true is what separates
        # this workflow from Performance Benchmark, which pins it to false.
        {
          echo "["
          if [ "$RUNNER" = "All" ]; then
            echo '{ "skip": false, "accuracy-testing": true }'
          else
            echo "{\"runs-on\": \"$RUNNER\", \"accuracy-testing\": true }"
          fi
          [ -n "$TEST_FILTER" ] && echo ",{\"filter\": \"$TEST_FILTER\"}"
          [ -n "$EXCLUDE" ] && echo ",{\"exclude\": \"$EXCLUDE\"}"
          echo "]"
        } > adv_filter.json
        filter=$(jq -r -c '.' adv_filter.json)

        {
          echo "filter=$filter"
          echo "skip_device_perf=$SKIP_DEVICE_PERF"
          echo "regression_check=$REGRESSION"
          echo "sh_runner=$SH_RUNNER"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Accuracy benchmark inputs"
          echo "Triggered by: ${{ github.event_name }}"
          echo "tt-mlir override: ${{ inputs.mlir_override || '(none - using TT_MLIR_VERSION from third_party/CMakeLists.txt)' }}"
          echo "Runs-on filter: $RUNNER"
          echo "Test filter: ${TEST_FILTER:-(all)}"
          echo "Exclude filter: ${EXCLUDE:-(none)}"
          echo "Accuracy regression check: $REGRESSION"
          echo "Skip device perf: $SKIP_DEVICE_PERF"
          echo "Resolved filter: \`$filter\`"
        } >> "$GITHUB_STEP_SUMMARY"

  run-accuracy-benchmarks:
    needs: [docker-build, set-inputs, build]
    if: ${{ !cancelled() && needs.set-inputs.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    secrets: inherit
    uses: ./.github/workflows/call-filtered-perf-tests.yml
    with:
      adv_filter: ${{ needs.set-inputs.outputs.filter }}
      docker_image: ${{ needs.docker-build.outputs.docker-image }}
      artifact_release_run_id: ${{ needs.build.outputs.artifacts_run_id }}
      artifact_suffix: ${{ needs.build.outputs.artifact_suffix }}
      torchxla_build_run_id: ${{ inputs.torchxla_build_run_id }}
      skip-device-perf: ${{ fromJSON(needs.set-inputs.outputs.skip_device_perf) }}
      regression_check: ${{ fromJSON(needs.set-inputs.outputs.regression_check) }}
      sh-runner: ${{ fromJSON(needs.set-inputs.outputs.sh_runner) }}
      wheel_build: ${{ inputs.manylinux_build && 'manylinux' || 'release' }}

  fail-notify:
    if: always()
    needs:
      - run-accuracy-benchmarks
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.check.outputs.failure }}
    steps:
      - name: Check if the needed jobs succeeded or failed
        id: check
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
