name: Update Test Durations

# TEMP / DO NOT MERGE: this file is temporarily repurposed on the
# jzx/tmp_disable_multilinux_profiling_test branch to smoke-test the release-wheel perf
# path (tt-xla #5663 / #5504). It is dispatchable from a feature branch because MAIN's copy
# of this file declares `workflow_dispatch`; a dispatch with --ref <branch> then runs THIS
# (branch) version. Trimmed to: build release wheel -> run one LLM + one vLLM perf benchmark
# on n150-perf using the release (tracy-enabled) wheel.
#
# REVERT THIS FILE TO ITS main VERSION BEFORE MERGE.
#
# Run with:
#   gh workflow run manual-update-durations.yml --ref jzx/tmp_disable_multilinux_profiling_test

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  packages: write
  checks: write

jobs:
  build-image:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
    with:
      dockbuild: ci # release-only smoke test doesn't need the manylinux image

  build-ttxla:
    uses: ./.github/workflows/call-build.yml
    name: "Build tt-xla"
    secrets: inherit
    needs: build-image
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      docker_image_manylinux: ${{ needs.build-image.outputs.docker-image-manylinux }}
      # release wheel produces both xla-whl-release and vllm-tt-whl-release
      build_types: release

  perf-benchmark:
    uses: ./.github/workflows/call-filtered-perf-tests.yml
    needs: [ build-image, build-ttxla ]
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image-base }}
      sh-runner: false
      skip-device-perf: true
      # no prior run on this branch to compare against
      regression_check: false
      # one LLM (test_llms.py) + one vLLM (test_vllm_benchmarks.py) on n150-perf: both import
      # tracy at module load, so this exercises the release-wheel tracy path end to end
      adv_filter: '[ {"accuracy-testing": false}, {"runs-on": "n150-perf", "filter": ["llama_3_2_1b"]} ]'
      artifact_release_run_id: ${{ needs.build-ttxla.outputs.artifacts_run_id }}
      artifact_suffix: ${{ needs.build-ttxla.outputs.artifact_suffix }}
      wheel_build: release
