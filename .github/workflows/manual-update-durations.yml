name: Manual vLLM Single-Device on QB2

# Runs the vLLM single-device tests on a Blackhole QB2 runner, pinned to a chip
# via TT_VISIBLE_DEVICES + the p150 mesh graph descriptor. Can be built against a
# specific tt-mlir branch/SHA via mlir_override (issue #5521).

on:
  workflow_dispatch:
    inputs:
      mlir_override:
        description: 'tt-mlir branch name OR git SHA to build against (blank = pinned version)'
        required: false
        type: string
      test_mark:
        description: 'pytest -m marker expression'
        required: false
        default: 'single_device'
        type: string
      pin_device:
        description: 'TT_VISIBLE_DEVICES value (which chip to pin)'
        required: false
        default: '1'
        type: string
      forge_models_override:
        description: 'tt-forge-models branch/SHA (optional)'
        required: false
        type: string

permissions:
  actions: write
  packages: write
  checks: write
  contents: read

run-name: "vLLM QB2 (mark: ${{ inputs.test_mark }}, chip: ${{ inputs.pin_device }}, mlir: ${{ inputs.mlir_override || 'pinned' }})"

jobs:
  build-image:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
    with:
      mlir_override: ${{ inputs.mlir_override }}

  build-ttxla:
    needs: build-image
    uses: ./.github/workflows/call-build.yml
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      mlir_override: ${{ inputs.mlir_override }}

  run-tests:
    needs: [ build-image, build-ttxla ]
    runs-on: qb2-blackhole
    container:
      image: ${{ needs.build-image.outputs.docker-image-base }}
      options: --device /dev/tenstorrent
      volumes:
        - /dev/hugepages:/dev/hugepages
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /etc/udev/rules.d:/etc/udev/rules.d
        - /lib/modules:/lib/modules
        - /opt/tt_metal_infra/provisioning/provisioning_env:/opt/tt_metal_infra/provisioning/provisioning_env
        - /mnt/dockercache:/mnt/dockercache
    env:
      GH_TOKEN: ${{ github.token }}
      TTMLIR_TOOLCHAIN_DIR: /opt/ttmlir-toolchain
      TT_XLA_CI: 1
      TT_METAL_OPERATION_TIMEOUT_SECONDS: ${{ vars.TT_METAL_OPERATION_TIMEOUT_SECONDS || 300 }}
      # ---- the two vars you asked for ----
      TT_VISIBLE_DEVICES: ${{ inputs.pin_device }}
      # TT_MESH_GRAPH_DESC_PATH is resolved at runtime below (its path differs in CI).

    steps:
      - name: Mark repo as safe for git
        run: |
          git config --global --add safe.directory /__w/tt-xla/tt-xla
          git config --global --add safe.directory /__w/tt-xla/tt-xla/third_party/tt_forge_models

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Override tt_forge_models ref
        if: ${{ inputs.forge_models_override != '' }}
        shell: bash
        run: |
          REF="${{ inputs.forge_models_override }}"
          RESOLVED=$(gh api repos/tenstorrent/tt-forge-models/commits/$REF --jq .sha 2>/dev/null || echo "$REF")
          cd third_party/tt_forge_models
          git fetch --depth=1 origin "$RESOLVED"
          git checkout FETCH_HEAD

      - name: Download and install wheels
        shell: bash
        run: |
          gh run download ${{ needs.build-ttxla.outputs.artifacts_run_id }} \
            --repo ${{ github.repository }} --dir wheels \
            --name xla-whl-release${{ needs.build-ttxla.outputs.artifact_suffix }}
          gh run download ${{ needs.build-ttxla.outputs.artifacts_run_id }} \
            --repo ${{ github.repository }} --dir wheels \
            --name vllm-tt-whl-release${{ needs.build-ttxla.outputs.artifact_suffix }}
          echo "Downloaded:"; ls -la wheels
          source venv/activate
          uv pip install wheels/*.whl

      - name: Resolve mesh graph descriptor path
        shell: bash
        run: |
          set -euo pipefail

          DESC="$(find / -name 'p150_mesh_graph_descriptor.textproto' -print -quit 2>/dev/null || true)"

          if [ -z "$DESC" ]; then
            echo "::error::p150_mesh_graph_descriptor.textproto not found in container"
            exit 1
          fi

          if [ ! -f "$DESC" ]; then
            echo "::error::Resolved descriptor path is not a file: $DESC"
            exit 1
          fi

          echo "Using mesh descriptor: $DESC"
          echo "TT_MESH_GRAPH_DESC_PATH=$DESC" >> "$GITHUB_ENV"

      - name: Run vLLM single-device tests
        env:
          HF_HOME: /mnt/dockercache/huggingface
          TORCH_HOME: /mnt/dockercache/torchhub
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          echo "TT_VISIBLE_DEVICES=$TT_VISIBLE_DEVICES"
          echo "TT_MESH_GRAPH_DESC_PATH=$TT_MESH_GRAPH_DESC_PATH"
          source venv/activate
          python -m pytest -v -m "${{ inputs.test_mark }}" \
            ./tests/integrations/vllm_plugin \
            --junitxml=report_${{ github.run_id }}.xml \
            2>&1 | tee pytest.log

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vllm-qb2-report
          path: |
            report_*.xml
            pytest.log
          if-no-files-found: ignore
