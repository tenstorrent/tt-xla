name: Perf Test (call)

on:
  workflow_call:
    inputs:
      matrix:
        description: "JSON matrix of tests to run"
        required: true
        type: string
      docker_image:
        description: "Docker image to use"
        required: true
        type: string
      artifact_release_run_id:
        description: 'Run ID of the artifacts (release)'
        required: false
        type: string
      artifact_suffix:
        description: 'Suffix for the artifact name'
        required: false
        type: string
      wheel_build:
        description: 'Build to use for testing, e.g. release, manylinux'
        required: false
        type: string
        default: release
      torchxla_build_run_id:
        description: 'Manual torch-xla build run ID'
        required: false
        type: string
        default: ''
      test_filter:
        description: "Optional pytest -k expression to further narrow the marked selection (used by manual runs)"
        required: false
        type: string
        default: ''
      regression_check:
        description: "Enable perf metrics regression testing"
        required: false
        type: boolean
        default: false
      check_fusions:
        description: "Verify expected fusion ops are present in compiled IR"
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ github.token }}
  TTMLIR_TOOLCHAIN_DIR: /opt/ttmlir-toolchain
  TT_XLA_CI: 1
  TT_METAL_OPERATION_TIMEOUT_SECONDS: ${{ vars.TT_METAL_OPERATION_TIMEOUT_SECONDS || 300 }}
  TT_METAL_DISPATCH_TIMEOUT_COMMAND_TO_EXECUTE: "/opt/tt-triage-venv/bin/python /opt/tt-triage/tools/tt-triage.py 1>&2"

jobs:
  run-perf-test:
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(inputs.matrix) }}

    runs-on: ${{ !matrix.build.shared-runners && fromJson(format('["{0}", "in-service"]', matrix.build.runs-on)) || matrix.build.runs-on }}

    name: "perf ${{ matrix.build.mark }} (${{ matrix.build.runs-on-original || matrix.build.runs-on }})"

    container:
      image: ${{ !matrix.build.shared-runners && inputs.docker_image || format('harbor.ci.tenstorrent.net/{0}', inputs.docker_image) }}
      options: --device /dev/tenstorrent
      volumes:
        - /dev/hugepages:/dev/hugepages
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /etc/udev/rules.d:/etc/udev/rules.d
        - /lib/modules:/lib/modules
        - /opt/tt_metal_infra/provisioning/provisioning_env:/opt/tt_metal_infra/provisioning/provisioning_env
        - /mnt/dockercache:/mnt/dockercache

    steps:
    - name: Mark repo as safe for git
      run: |
        git config --global --add safe.directory /__w/tt-xla/tt-xla

    - name: Set caching env variables
      shell: bash
      run: |
        if [[ "${{ matrix.build.shared-runners }}" != "true" ]]; then
          echo "DOCKER_CACHE_ROOT=/mnt/dockercache" >> $GITHUB_ENV
        fi

    - uses: actions/checkout@v6
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github/
          tests/
          third_party/
          pytest.ini
          python_package/requirements.txt
          venv/
          third_party/CMakeLists.txt

    - name: Initialize submodules
      shell: bash
      run: |
        git submodule update --init --recursive third_party/tt_forge_models

    - name: Set reusable strings
      id: strings
      shell: bash
      env:
        JOB_ID: ${{ job.check_run_id }}
      run: |
        echo "work-dir=$(pwd)" >> "$GITHUB_OUTPUT"
        echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
        # Each test writes its own JSON into this directory (see the output_file fixture).
        echo "perf_report_path=$(pwd)/perf_reports" >> "$GITHUB_OUTPUT"

    - name: Install gh CLI
      shell: bash
      run: |
        if ! command -v gh &> /dev/null; then
          if [ -f /etc/apt/sources.list.d/archive_uri-https_apt_llvm_org_noble_-noble.list ]; then
            rm -f /etc/apt/sources.list.d/archive_uri-https_apt_llvm_org_noble_-noble.list
          fi
          apt-get update -y -qq
          apt-get install -y -qq --no-install-recommends curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update -y -qq
          apt-get install -y -qq --no-install-recommends gh
        fi

    - name: Download and install wheel
      shell: bash
      run: |
        echo "=== Downloading wheel ==="
        gh run download ${{ inputs.artifact_release_run_id }} \
          --repo ${{ github.repository }} \
          --dir wheels \
          --name xla-whl-${{ inputs.wheel_build }}${{ inputs.artifact_suffix }}

        if [[ "${{ matrix.build.vllm }}" == "true" ]]; then
          echo "=== Downloading vllm-tt wheel ==="
          gh run download ${{ inputs.artifact_release_run_id }} \
            --repo ${{ github.repository }} \
            --dir wheels \
            --name vllm-tt-whl-release${{ inputs.artifact_suffix }}
        fi

        echo "=== Installing wheel ==="
        source venv/activate
        pip install wheels/*.whl

    - name: Install system dependencies
      shell: bash
      run: |
        if [ -f /etc/apt/sources.list.d/archive_uri-https_apt_llvm_org_noble_-noble.list ]; then
          rm -f /etc/apt/sources.list.d/archive_uri-https_apt_llvm_org_noble_-noble.list
        fi
        apt-get update -y -qq
        apt-get install -y -qq --no-install-recommends ${{ matrix.build.libreq }}

    - name: Install custom torch_xla from workflow run
      if: ${{ inputs.torchxla_build_run_id != '' }}
      shell: bash
      run: |
        echo "Using custom torchxla install from run ${{ inputs.torchxla_build_run_id }}"
        gh run download ${{ inputs.torchxla_build_run_id }} --repo ${{ github.repository }}
        source venv/activate
        uv pip install --force-reinstall xla-torch-wheel-release/*.whl
        uv pip show torch_xla

    - name: Create perf report directory
      run: mkdir -p ${{ steps.strings.outputs.perf_report_path }}

    - name: Run benchmark
      id: run-benchmark
      shell: bash
      env:
        HF_HOME: /mnt/dockercache/huggingface
        TORCH_HOME: /mnt/dockercache/torchhub
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        TEST_FILTER: ${{ inputs.test_filter }}
      run: |
        cd ${{ steps.strings.outputs.work-dir }}
        export PYTHONPATH="${{ steps.strings.outputs.work-dir }}:$PYTHONPATH"

        source venv/activate
        # Select the (hardware, lane) group by marker; each test writes its own report
        # into --output-dir. An optional -k filter narrows the selection for manual runs.
        EXTRA=()
        if [ -n "$TEST_FILTER" ]; then EXTRA+=(-k "$TEST_FILTER"); fi
        pytest -svv tests/benchmark --confcutdir=tests/benchmark -m "${{ matrix.build.mark }}" \
          ${{ matrix.build.accuracy-testing && '--accuracy-testing' || '' }} \
          ${{ inputs.check_fusions && '--check-fusions' || '' }} \
          "${EXTRA[@]}" \
          --output-dir ${{ steps.strings.outputs.perf_report_path }}

    # IR dumps: one job now runs many models, so bulk-upload all of this job's StableHLO
    # IR at once. Each model's files are prefixed by its export name (shlo_<model>_...),
    # so a report links to this bundle and its own files are found by that prefix.
    - name: Upload StableHLO MLIR
      id: upload-stablehlo-mlir
      uses: actions/upload-artifact@v6
      if: success() || failure()
      with:
        name: stablehlo-mlir-${{ steps.strings.outputs.job_id }}
        path: modules/irs/shlo_*.mlir
        if-no-files-found: ignore

    - name: Upload TTIR MLIR
      id: upload-ttir-mlir
      uses: actions/upload-artifact@v6
      if: success() || failure()
      with:
        name: ttir-mlir-${{ steps.strings.outputs.job_id }}
        path: modules/irs/ttir_*.mlir
        if-no-files-found: ignore

    - name: Upload TTNN MLIR
      id: upload-ttnn-mlir
      uses: actions/upload-artifact@v6
      if: success() || failure()
      with:
        name: ttnn-mlir-${{ steps.strings.outputs.job_id }}
        path: modules/irs/ttnn_*.mlir
        if-no-files-found: ignore

    - name: Add config fields to perf reports
      if: success() || failure()
      shell: bash
      run: |
        REPORT_DIR="${{ steps.strings.outputs.perf_report_path }}"
        # One IR bundle per job; every report in this job shares its URL (files inside are
        # identified by their <model> filename prefix).
        STABLEHLO_URL="${{ steps.upload-stablehlo-mlir.outputs.artifact-url || '' }}"
        TTIR_URL="${{ steps.upload-ttir-mlir.outputs.artifact-url || '' }}"
        TTNN_URL="${{ steps.upload-ttnn-mlir.outputs.artifact-url || '' }}"
        JOB_ID_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ steps.strings.outputs.job_id }}"

        shopt -s nullglob
        for report in "$REPORT_DIR"/*.json; do
          python3 tests/benchmark/scripts/extend_result_config.py "$report" \
            ${STABLEHLO_URL:+--stablehlo-url "$STABLEHLO_URL"} \
            ${TTIR_URL:+--ttir-url "$TTIR_URL"} \
            ${TTNN_URL:+--ttnn-url "$TTNN_URL"} \
            --job-id-url "$JOB_ID_URL"
        done

    # Patch report fields that can't be properly set in benchmark scripts
    - name: Patch report fields
      if: success() || failure()
      shell: bash
      run: |
        REPORT_DIR="${{ steps.strings.outputs.perf_report_path }}"
        # Patch device_info.device_type from CI runner (uniform across the job's tests).
        MACHINE_TYPE="${{ matrix.build.runs-on-original }}"
        if [ -n "$MACHINE_TYPE" ]; then
          shopt -s nullglob
          for report in "$REPORT_DIR"/*.json; do
            jq --arg mt "$MACHINE_TYPE" '.device_info.device_type = $mt' "$report" > "${report}.tmp" \
              && mv "${report}.tmp" "$report"
          done
          echo "Patched device_info.device_type to '$MACHINE_TYPE' in $REPORT_DIR"
        fi

    - name: Upload Perf Report
      uses: actions/upload-artifact@v6
      if: success() || failure()
      with:
        name: perf-reports-${{ steps.strings.outputs.job_id }}
        path: ${{ steps.strings.outputs.perf_report_path }}
        if-no-files-found: ignore

    # Perf / Accuracy Regression Check (one report per test, so query + check per report)
    - name: Set regression query strings
      id: set-query-strings
      if: inputs.regression_check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # mode + baseline pipeline are uniform across the job (accuracy flag + hardware fixed).
        if [[ "${{ matrix.build.accuracy-testing }}" == "true" ]]; then
          mode="accuracy"
          workflow_file="schedule-benchmark-experimental.yml"
        else
          mode="perf"
          workflow_file="schedule-nightly.yml"
        fi
        echo "mode=$mode" >> $GITHUB_OUTPUT
        workflow_id=$(curl -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${workflow_file}/runs?status=completed&branch=main&per_page=100" \
          | jq -r '.workflow_runs[0].id')
        echo "last_nightly_workflow_id=$workflow_id" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials for Superset
      if: inputs.regression_check
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::533267429815:role/github-actions-api-gateway-role
        aws-region: us-east-2

    - name: Check perf regression
      if: inputs.regression_check
      shell: bash
      run: |
        python3 -m pip install boto3 requests
        REPORT_DIR="${{ steps.strings.outputs.perf_report_path }}"
        MODE="${{ steps.set-query-strings.outputs.mode }}"
        PIPELINE_ID="${{ steps.set-query-strings.outputs.last_nightly_workflow_id }}"
        DEVICE_TYPE="${{ matrix.build.runs-on-original }}"
        FAILED=0
        shopt -s nullglob
        for report in "$REPORT_DIR"/*.json; do
          display_name=$(jq -r '.config.display_name' "$report")
          arch=$(jq -r '.device_info.arch // ""' "$report")
          params=$(jq -nc \
            --arg dn "$display_name" --arg pid "$PIPELINE_ID" \
            --arg arch "$arch" --arg dt "$DEVICE_TYPE" \
            '{project:"tt-forge/tt-xla",display_name:$dn,github_pipeline_id:$pid,arch:$arch,device_type:$dt}')
          prev=$(API_QUERY='benchmarks/last_measurement' API_QUERY_PARAMS="$params" \
            python3 .github/actions/superset-api/call_api.py || echo '[]')
          echo "Regression check ($MODE): $display_name"
          python3 .github/scripts/check_regression.py \
            --prev-report "$prev" \
            --current-report "$report" \
            --mode "$MODE" || FAILED=1
        done
        exit $FAILED
