name: Test Multihost (call)

# Runs tt-xla tests on the exabox Galaxy cluster through the ttop
# allocation/environment orchestration (the same composite actions tt-metal and
# tt-umd use). The single `run-tests` job is three phases:
#
#   prepare  - allocate sc1/sc4/sc16 hosts, bring up an SSH worker environment
#              from the tt-xla base image, fan the workspace + wheel out to every
#              allocated host over the shared NFS volume, reset the cards.
#   test     - build the pytest command the same way call-test.yml does and run
#              it on the cluster.
#   teardown - always delete the ttop environment and allocation.
#
# Unlike call-test.yml this job does not run inside a job container: the exabox
# runner only orchestrates, and every test command executes inside the ttop
# worker pods (over `mpirun --pernode` for per-host setup, over `ssh` for pytest).
#
# Why pytest is launched on a single host instead of with `mpirun --pernode`:
# tt-xla's pytest process is the distributed *controller*. ClientInstance calls
# launchDistributedRuntime (pjrt_implementation/src/api/client_instance.cc) which
# spawns one `worker` process per host itself over MPI/SSH. Running pytest under
# mpirun would nest an MPI job inside another one; the tt-metal/tt-umd workflows
# can use `--pernode` only because their test binaries are SPMD.

permissions:
  actions: write
  checks: write
  contents: read
  id-token: write # the ttop actions mint an OIDC token for kubectl

on:
  workflow_call:
    inputs:
      docker_image:
        description: 'Docker image used as the ttop worker image (tt-xla base image)'
        required: true
        type: string
      artifact_release_run_id:
        description: 'Run ID of the artifacts (release)'
        required: true
        type: string
      artifact_suffix:
        description: 'Suffix for the artifact name'
        required: false
        type: string
      test_suite:
        description: 'Test suite preset options or custom'
        required: true
        type: string
      test_suite_custom:
        description: 'Custom test suite json'
        required: false
        type: string
      include_passed:
        description: 'Include passed tests in the summary'
        required: false
        default: false
        type: boolean
      forge_models_override:
        description: 'Git SHA of commit (or branch name) in tenstorrent/tt-forge-models'
        required: false
        type: string
        default: ''

env:
  GH_TOKEN: ${{ github.token }} # for gh cli tool
  TT_METAL_OPERATION_TIMEOUT_SECONDS: ${{ vars.TT_METAL_OPERATION_TIMEOUT_SECONDS || 300 }}
  # tt-metal ref that provides the ttop composite actions and the SSH setup
  # helper. Keep in sync with the pinned SHA on the `uses:` lines below.
  TT_METAL_TTOP_REF: 0b0d71bbee030c636a7fff7054de29f3a68e093e

jobs:
  generate-matrix-test:
    uses: ./.github/workflows/call-generate-matrix.yml
    secrets: inherit
    with:
      test_suite: ${{ inputs.test_suite }}
      test_suite_custom: ${{ inputs.test_suite_custom }}

  run-tests:
    needs: generate-matrix-test
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.generate-matrix-test.outputs.test_matrix) }}

    # `matrix.build.runs-on` is the exabox hardware to allocate (sc1/sc4/sc16),
    # not a runner label - every entry runs on the same orchestrating runner.
    runs-on:
      - exabox-multihost-with-nfs

    name: "test ${{ matrix.build.test-mark }} (${{ matrix.build.runs-on }}, ${{ matrix.build.name }}, ${{ strategy.job-index }})"

    env:
      # ttop objects and the shared-volume scratch dir are namespaced per matrix
      # job so parallel entries never collide and teardown always targets this
      # job's own allocation.
      ALLOCATION_NAME: ci-xla-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      RUN_DIR: /ci/xla-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      # Allocation configs (hostfile, rankfile, rank_bindings.yaml) are mounted at
      # this path on the runner and inside every worker pod.
      TTOP_DIR: /etc/ttop
      # Where the workspace is unpacked on every allocated host. The tt-xla venv
      # bakes in its absolute path, so this must be identical on all hosts.
      WORKER_SRC: /home/user/tt-xla

    steps:

    - uses: actions/checkout@v6
      with:
        submodules: recursive
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github/scripts/
          .gitmodules
          .test_durations
          pjrt_implementation/
          third_party/pjrt_c_api/
          pytest.ini
          python_package/requirements.txt
          integrations/vllm_plugin/requirements-vllm-plugin.txt
          tests/
          venv/
          examples/
          scripts/
          mixed_precision/

    - name: Override tt_forge_models ref
      if: ${{ inputs.forge_models_override != '' }}
      shell: bash
      run: |
        # Resolve short SHAs/refs via GitHub API, fall back to raw input
        REF="${{ inputs.forge_models_override }}"
        RESOLVED=$(gh api repos/tenstorrent/tt-forge-models/commits/$REF --jq .sha 2>/dev/null || echo "$REF")
        cd third_party/tt_forge_models
        git fetch --depth=1 origin $RESOLVED
        git checkout FETCH_HEAD
        echo "tt_forge_models checked out at $(git rev-parse HEAD)"

    - name: Set reusable strings
      id: strings
      shell: bash
      env:
        JOB_ID: ${{ job.check_run_id }}
      run: |
        # Multihost always tests the release wheel (matches call-test.yml, which
        # forces wheel_build to release for multihost matrix entries).
        echo "wheel_artifact_name=xla-whl-release${{ inputs.artifact_suffix }}" >> "$GITHUB_OUTPUT"
        echo "test_report_name=report_$JOB_ID.xml" >> "$GITHUB_OUTPUT"
        # Results live on the shared volume so the runner can upload artifacts
        # that pytest produced inside a worker pod.
        echo "RESULTS_DIR=$RUN_DIR/results" >> "$GITHUB_ENV"

    # Fail before an allocation is minted if the wheel we are about to test does
    # not exist - a stale artifact_release_run_id would otherwise burn cluster time.
    - name: Check wheel artifact exists
      shell: bash
      run: |
        set -euo pipefail
        NAME="${{ steps.strings.outputs.wheel_artifact_name }}"
        RUN_ID="${{ inputs.artifact_release_run_id }}"
        # Scoped to the run we are about to download from, so a same-named
        # artifact left over from an older run cannot mask a missing one.
        COUNT=$(curl -sf -H "Authorization: token ${{ github.token }}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
          | jq -r --arg n "$NAME" '[.artifacts[] | select(.name == $n and .expired == false)] | length')
        echo "Found ${COUNT:-0} artifact(s) named $NAME on run $RUN_ID"
        if [[ -z "$COUNT" || "$COUNT" == "0" ]]; then
          echo "::error::Wheel artifact $NAME not found on run $RUN_ID"
          exit 1
        fi

    - name: Resolve allocation spec for ${{ matrix.build.runs-on }}
      id: sku
      shell: bash
      env:
        HARDWARE: ${{ matrix.build.runs-on }}
        # Optional matrix override for the tt-mlir rank binding name.
        RANK_BINDING_OVERRIDE: ${{ matrix.build.rank-binding }}
      run: |
        set -euo pipefail

        # COUNT        - number of Galaxies to allocate
        # TOPOLOGY_KEY - exabox topology key the Galaxies must share
        # RANK_BINDING - TT_DISTRIBUTED_RANK_BINDING for the tt-mlir distributed
        #                runtime; empty means "run on a single host, no distributed
        #                runtime". See rank_binding_paths in
        #                pjrt_implementation/src/api/client_instance.cc for the
        #                binding names tt-mlir knows about.
        case "$HARDWARE" in
          sc1)
            COUNT=1; TOPOLOGY_KEY=""; RANK_BINDING="" ;;
          sc4)
            COUNT=4; TOPOLOGY_KEY="exabox.tenstorrent.com/quad"; RANK_BINDING="32x4_quad_bh_galaxy" ;;
          sc16)
            COUNT=16; TOPOLOGY_KEY="exabox.tenstorrent.com/SC16"; RANK_BINDING="" ;;
          *)
            echo "::error::Unknown hardware '$HARDWARE' (expected sc1, sc4 or sc16)"
            exit 1 ;;
        esac

        if [[ -n "$RANK_BINDING_OVERRIDE" ]]; then
          RANK_BINDING="$RANK_BINDING_OVERRIDE"
        fi
        if [[ "$COUNT" -gt 1 && -z "$RANK_BINDING" ]]; then
          echo "::warning::No tt-mlir rank binding is registered for $HARDWARE, so tests will run on a single host. Set 'rank-binding' on the test matrix entry once one exists."
        fi

        {
          echo "allocationType: Count"
          echo "count: ${COUNT}"
          if [[ -n "$TOPOLOGY_KEY" ]]; then
            echo "topologyKeys:"
            echo "  - ${TOPOLOGY_KEY}"
          fi
        } > /tmp/allocation_spec.yaml

        echo "Resolved allocation spec for $HARDWARE:"
        cat /tmp/allocation_spec.yaml
        {
          echo "allocation_spec<<SPEC_EOF"
          cat /tmp/allocation_spec.yaml
          echo "SPEC_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "rank_binding=$RANK_BINDING" >> "$GITHUB_OUTPUT"

    - name: Parse worker image
      id: worker-image
      shell: bash
      run: |
        IMAGE="${{ inputs.docker_image }}"
        echo "repository=${IMAGE%:*}" >> "$GITHUB_OUTPUT"
        echo "tag=${IMAGE##*:}" >> "$GITHUB_OUTPUT"

    - name: Fetch ttop helpers from tt-metal
      # metal's ttop-* composites resolve ./.github/actions/ttop-await-resource
      # and .github/scripts/environment-ssh-setup.sh against THIS workspace.
      uses: actions/checkout@v6
      with:
        repository: tenstorrent/tt-metal
        ref: ${{ env.TT_METAL_TTOP_REF }}
        sparse-checkout: |
          .github/scripts/environment-ssh-setup.sh
          .github/actions/ttop-await-resource
        sparse-checkout-cone-mode: false
        path: _tt-metal
        persist-credentials: false

    - name: Install ttop helpers from tt-metal
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .github/scripts .github/actions
        cp _tt-metal/.github/scripts/environment-ssh-setup.sh .github/scripts/
        chmod +x .github/scripts/environment-ssh-setup.sh
        cp -R _tt-metal/.github/actions/ttop-await-resource .github/actions/
        # Keep the helper checkout out of the tree that gets fanned out to workers.
        rm -rf _tt-metal

    - name: Create allocation
      uses: tenstorrent/tt-metal/.github/actions/ttop-create-allocation@0b0d71bbee030c636a7fff7054de29f3a68e093e
      timeout-minutes: 120
      with:
        allocationName: ${{ env.ALLOCATION_NAME }}
        namespace: ttop-ci
        spec: ${{ steps.sku.outputs.allocation_spec }}

    - name: Get allocation configs
      uses: tenstorrent/tt-metal/.github/actions/ttop-get-allocation-data@0b0d71bbee030c636a7fff7054de29f3a68e093e
      with:
        allocationName: ${{ env.ALLOCATION_NAME }}
        allocationNamespace: ttop-ci
        path: /etc/ttop

    - name: Resolve cluster hosts
      shell: bash
      env:
        RANK_BINDING: ${{ steps.sku.outputs.rank_binding }}
      run: |
        set -euo pipefail
        CONTROLLER_HOST=$(awk 'NF {print $1; exit}' "$TTOP_DIR/hostfile")
        if [[ -z "$CONTROLLER_HOST" ]]; then
          echo "::error::No hosts found in $TTOP_DIR/hostfile"
          exit 1
        fi
        echo "Allocated hosts:"
        cat "$TTOP_DIR/hostfile"
        echo "Controller host: $CONTROLLER_HOST"
        echo "CONTROLLER_HOST=$CONTROLLER_HOST" >> "$GITHUB_ENV"

        mkdir -p "$RESULTS_DIR"
        chmod -R 777 "$RUN_DIR"

        # Environment the PJRT plugin needs to launch its distributed runtime.
        # TT_DISTRIBUTED_PLM_RSH_AGENT is deliberately left unset: plain `ssh`
        # works from the controller pod once this run's SSH config is installed
        # there (see "Distribute SSH credentials to workers"), so the docker-exec
        # indirection of tests/torch/multi_host/experimental/remote_docker.sh is
        # not needed on ttop.
        : > "$RUN_DIR/distributed_env.sh"
        if [[ -n "$RANK_BINDING" ]]; then
          {
            echo "export TT_RUNTIME_ENABLE_DISTRIBUTED=1"
            echo "export TT_DISTRIBUTED_RANK_BINDING=$RANK_BINDING"
            echo "export TT_DISTRIBUTED_HOSTS_FILE=$TTOP_DIR/hostfile"
            echo "export TT_DISTRIBUTED_CONTROLLER_HOST_NAME=$CONTROLLER_HOST"
            # Only needed for more than two hosts, harmless otherwise.
            if [[ -f "$TTOP_DIR/rankfile" ]]; then
              echo "export TT_DISTRIBUTED_RANK_FILE_PATH=$TTOP_DIR/rankfile"
            fi
          } > "$RUN_DIR/distributed_env.sh"
        fi
        echo "Distributed environment:"
        cat "$RUN_DIR/distributed_env.sh"

    - name: Create test environment
      uses: tenstorrent/tt-metal/.github/actions/ttop-create-environment@0b0d71bbee030c636a7fff7054de29f3a68e093e
      timeout-minutes: 30
      with:
        environmentName: ${{ env.ALLOCATION_NAME }}
        allocationName: ${{ env.ALLOCATION_NAME }}
        allocationNamespace: ttop-ci
        workerRepository: ${{ steps.worker-image.outputs.repository }}
        workerTag: ${{ steps.worker-image.outputs.tag }}
        useDevHostMount: "true"
        sharedVolumeEnabled: "true"
        path: /etc/ttop

    - name: Download tt-xla wheel
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.strings.outputs.wheel_artifact_name }}
        path: /ci/artifacts
        run-id: ${{ inputs.artifact_release_run_id }}
        github-token: ${{ github.token }}

    - name: Distribute SSH credentials to workers
      shell: bash
      run: |
        set -euo pipefail
        # ttop-create-environment authorized this runner's key on every worker pod
        # and wrote the host -> pod SSH config. The tt-xla distributed runtime
        # launches its workers *from* the controller pod, so that pod needs the
        # same key and config to reach its peers.
        SSH_STAGE="$RUN_DIR/ssh"
        mkdir -p "$SSH_STAGE"
        cp /home/runner/.ssh/id_ed25519 /home/runner/.ssh/config "$SSH_STAGE/"

        # Host-key prompts would hang MPI's non-interactive ssh. A trailing
        # `Host *` stanza is safe: ssh_config is first-match-wins per keyword and
        # the generated per-host blocks do not set any of these.
        cat >> "$SSH_STAGE/config" <<'SSH_EOF'

        Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
        SSH_EOF
        cp "$SSH_STAGE/config" /home/runner/.ssh/config
        chmod 600 /home/runner/.ssh/config
        # Readable by the pod user (uid 1001) over the shared volume.
        chmod 644 "$SSH_STAGE/id_ed25519" "$SSH_STAGE/config"

        mpirun --pernode --tag-output bash -lc '
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 '"$SSH_STAGE"'/id_ed25519 ~/.ssh/id_ed25519
          install -m 600 '"$SSH_STAGE"'/config ~/.ssh/config
          chmod 700 ~/.ssh
          echo "$(hostname): ssh credentials installed"
        '

    - name: Stage workspace and install wheel on every host
      shell: bash
      run: |
        set -euo pipefail
        # Stage once on the shared volume, then every host copies from there.
        rm -rf "$RUN_DIR/tt-xla"
        cp -r "$GITHUB_WORKSPACE" "$RUN_DIR/tt-xla"

        shopt -s nullglob
        WHEELS=(/ci/artifacts/*.whl)
        if [[ ${#WHEELS[@]} -eq 0 ]]; then
          echo "::error::No tt-xla wheel found under /ci/artifacts"
          ls -R /ci/artifacts || true
          exit 1
        fi
        echo "Installing wheel(s): ${WHEELS[*]}"

        mpirun --pernode --tag-output bash -lc '
          set -euo pipefail
          rm -rf '"$WORKER_SRC"'
          cp -r '"$RUN_DIR"'/tt-xla '"$WORKER_SRC"'
          echo "$(hostname): workspace staged at '"$WORKER_SRC"'"
        '

        # venv/activate creates the venv on first use and bakes in its absolute
        # path, hence the identical WORKER_SRC on every host. Done per host so the
        # wheel and its deps are present wherever the distributed runtime spawns
        # a worker.
        # NOTE: no `set -u` around venv/activate - it dereferences optional vars
        # such as SYSTEM_DIST_PACKAGES and LD_LIBRARY_PATH.
        mpirun --pernode --tag-output bash -lc '
          set -eo pipefail
          cd '"$WORKER_SRC"'
          source venv/activate
          uv pip install '"${WHEELS[*]}"'
          echo "$(hostname): wheel installed"
        '

    - name: Reset cards and check cluster health
      timeout-minutes: 45
      shell: bash
      run: |
        set -uo pipefail
        MAX_RECOVERY_ATTEMPTS=5

        echo "--- Pre-check: tt-smi visibility on all hosts ---"
        mpirun --pernode --tag-output bash -lc '
          snapshot=$(tt-smi --snapshot_no_tty --snapshot)
          driver=$(jq -r ".host_info.Driver // \"unknown\"" <<< "$snapshot")
          tt_smi=$(jq -r ".host_sw_vers.tt_smi // \"unknown\"" <<< "$snapshot")
          echo "$(hostname): Driver=${driver} tt_smi=${tt_smi}"
        ' || true

        for attempt in $(seq 1 "$MAX_RECOVERY_ATTEMPTS"); do
          echo "=== Reset attempt $attempt of $MAX_RECOVERY_ATTEMPTS ==="
          if ! mpirun --pernode --tag-output tt-smi -glx_reset; then
            echo "WARNING: -glx_reset failed on attempt $attempt, trying tt-smi -r"
            if ! mpirun --pernode --tag-output tt-smi -r; then
              echo "WARNING: reset failed on attempt $attempt"
              sleep 30
              continue
            fi
          fi

          echo "--- Sleeping 5s after reset to allow links/services to settle ---"
          sleep 5

          echo "--- Post-reset tt-smi snapshot on all hosts ---"
          if mpirun --pernode --tag-output tt-smi --snapshot_no_tty --snapshot; then
            echo "SUCCESS: reset and health check passed on attempt $attempt"
            exit 0
          fi

          echo "WARNING: health check failed on attempt $attempt"
          sleep 30
        done

        echo "::error::Card reset / health check failed after $MAX_RECOVERY_ATTEMPTS attempts"
        exit 1

    - name: Set pytest command
      shell: bash
      env:
        FORKED: ${{ matrix.build.forked }}
        TEST_DIR: ${{ matrix.build.dir }}
        TEST_MARK: ${{ matrix.build.test-mark }}
        TEST_CONTAINS: ${{ matrix.build.contains }}
        TEST_ARGS: ${{ matrix.build.args }}
        PARALLEL_GROUPS: ${{ matrix.build.parallel-groups || 1 }}
        GROUP_ID: ${{ matrix.build.group-id || 1 }}
      run: |
        # NOTE: Torch tests must be run in separate processes to avoid current issues with test isolation
        # See issue: https://github.com/tenstorrent/tt-xla/issues/795
        PYTEST_FORKED=""
        if [[ "$FORKED" == "true" ]]; then
          PYTEST_FORKED="--forked"
        fi

        # Set verbosity: default to -sv, switch to -vv when forking to get progress percentage
        if [[ -n "$PYTEST_FORKED" ]]; then
          VERBOSITY="-vv"
        else
          VERBOSITY="-sv"
        fi

        # Add -m/-k only when provided to avoid empty-argument parsing issues.
        MARKS_ARG=""
        if [[ -n "$TEST_MARK" ]]; then
          MARKS_ARG="-m '$TEST_MARK'"
        fi

        CONTAINS_ARG=""
        if [[ -n "$TEST_CONTAINS" ]]; then
          CONTAINS_ARG="-k '$TEST_CONTAINS'"
        fi

        BASE_PYTEST_CMD="$PYTEST_FORKED --log-memory \
          --durations=0 \
          $TEST_DIR \
          $MARKS_ARG $TEST_ARGS \
          $CONTAINS_ARG \
          --splits $PARALLEL_GROUPS \
          --group $GROUP_ID \
          --splitting-algorithm least_duration"

        echo "BASE_PYTEST_CMD=$BASE_PYTEST_CMD" >> $GITHUB_ENV
        echo "VERBOSITY=$VERBOSITY" >> $GITHUB_ENV

    # NOTE: the heredoc bodies below sit at the base indentation of the shell
    # block on purpose - the generated script must not inherit YAML indentation,
    # and the heredoc terminator has to start at the beginning of a line.
    - name: Collect tests
      id: collect-tests
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUN_DIR/collect_tests.sh" <<EOF
        #!/usr/bin/env bash
        set -eo pipefail
        cd $WORKER_SRC
        source venv/activate
        echo "Collecting tests for group ${{ matrix.build.group-id || 1 }}..."
        python -m pytest --collect-only -q --disable-warnings $BASE_PYTEST_CMD |& tee $RUN_DIR/collected_tests.txt
        EOF

        ssh -o BatchMode=yes "$CONTROLLER_HOST" bash "$RUN_DIR/collect_tests.sh"

        # Unlike call-test.yml this does not special-case the `notimeout` marker;
        # add it here if a multihost test ever needs the flat 240 minute budget.
        SCRIPT_OUTPUT=$(python3 .github/scripts/calculate_test_timeout.py \
          --collected-output "$RUN_DIR/collected_tests.txt" \
          --durations-file .test_durations \
          --default-timeout 240)
        echo "$SCRIPT_OUTPUT"
        ESTIMATED_DURATION=$(echo "$SCRIPT_OUTPUT" | tail -n 1)

        echo "Estimated duration: $ESTIMATED_DURATION minutes"
        echo "timeout-minutes=$ESTIMATED_DURATION" >> "$GITHUB_OUTPUT"

    - name: Run tests
      timeout-minutes: ${{ fromJson(steps.collect-tests.outputs.timeout-minutes) }}
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUN_DIR/run_tests.sh" <<EOF
        #!/usr/bin/env bash
        set -eo pipefail
        cd $WORKER_SRC
        source venv/activate
        source $RUN_DIR/distributed_env.sh
        export TT_XLA_CI=1
        export ENABLE_BRINGUP_STAGE_LOGGING=1
        export TT_METAL_OPERATION_TIMEOUT_SECONDS=$TT_METAL_OPERATION_TIMEOUT_SECONDS
        export TT_METAL_DISPATCH_TIMEOUT_COMMAND_TO_EXECUTE="/opt/tt-triage-venv/bin/python -vvv /opt/tt-triage/tools/tt-triage.py 1>&2"
        # Model caches live on the shared volume so they are reused across hosts and runs.
        export HF_HOME=/ci/cache/huggingface
        export TORCH_HOME=/ci/cache/torchhub
        mkdir -p $RESULTS_DIR
        python -m pytest $VERBOSITY $BASE_PYTEST_CMD --junitxml=$RESULTS_DIR/${{ steps.strings.outputs.test_report_name }} --perf-report-dir=$RESULTS_DIR/benchmark_reports 2>&1 | tee $RESULTS_DIR/pytest.log
        EOF

        echo "=== Test command ==="
        cat "$RUN_DIR/run_tests.sh"
        echo "===================="
        ssh -o BatchMode=yes "$CONTROLLER_HOST" bash "$RUN_DIR/run_tests.sh"

    # produce_cicd_data silently drops artifacts with spaces in the name, must replace spaces with underscores
    # until https://github.com/tenstorrent/tt-github-actions/issues/78 is fixed
    - name: Sanitize test_mark
      id: sanitize
      if: success() || failure()
      shell: bash
      run: echo "test_mark=${TEST_MARK// /_}" >> $GITHUB_OUTPUT
      env:
        TEST_MARK: ${{ matrix.build.test-mark }}

    # pytest wrote its reports inside a worker pod, so pick them up from the
    # shared volume where upload-artifact can see them.
    - name: Collect results from shared volume
      if: success() || failure()
      shell: bash
      run: |
        mkdir -p reports
        if [[ -d "$RESULTS_DIR" ]]; then
          cp -r "$RESULTS_DIR/." reports/ || true
        fi
        ls -la reports || true

    - name: Upload Test Log
      uses: actions/upload-artifact@v6
      if: success() || failure()
      with:
        name: test-log-${{ matrix.build.runs-on }}-${{ steps.sanitize.outputs.test_mark }}-${{ job.check_run_id }}
        path: reports/pytest.log
        if-no-files-found: ignore

    - name: Upload Test Report
      uses: actions/upload-artifact@v6
      if: success() || failure()
      with:
        name: test-reports-${{ needs.generate-matrix-test.outputs.test_matrix_hash }}-${{ github.run_attempt }}.${{ strategy.job-index }}-${{ matrix.build.runs-on }}-${{ steps.sanitize.outputs.test_mark }}-${{ job.check_run_id }}
        path: reports/${{ steps.strings.outputs.test_report_name }}
        if-no-files-found: ignore

    # If no perf tests ran, this step will emit a warning (no files to upload) but won't fail the job.
    - name: Upload Benchmark Report
      uses: actions/upload-artifact@v6
      if: success() || failure()
      with:
        name: perf-reports-${{ needs.generate-matrix-test.outputs.test_matrix_hash }}-${{ github.run_attempt }}.${{ strategy.job-index }}-${{ matrix.build.runs-on }}-${{ steps.sanitize.outputs.test_mark }}-${{ job.check_run_id }}
        path: reports/benchmark_reports
        # If no perf tests ran, no files are generated so this ignore is needed to avoid failing the job.
        if-no-files-found: 'ignore'

    - name: Clean up shared volume
      if: always()
      shell: bash
      run: rm -rf "$RUN_DIR" || true

    - name: Delete test environment
      if: always()
      uses: tenstorrent/tt-metal/.github/actions/ttop-delete-environment@0b0d71bbee030c636a7fff7054de29f3a68e093e
      with:
        environmentName: ${{ env.ALLOCATION_NAME }}
        namespace: ttop-ci

    - name: Delete allocation
      if: always()
      uses: tenstorrent/tt-metal/.github/actions/ttop-delete-allocation@0b0d71bbee030c636a7fff7054de29f3a68e093e
      with:
        allocationName: ${{ env.ALLOCATION_NAME }}
        namespace: ttop-ci

  test-summary:
    runs-on: ubuntu-latest
    needs: [ generate-matrix-test, run-tests ]
    if: success() || failure()
    steps:
      - uses: actions/checkout@v6
      - name: Process test summary
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --pattern "test-reports-${{ needs.generate-matrix-test.outputs.test_matrix_hash }}-*" --dir test_reports || echo "No reports found"
          find test_reports -name "report_*.xml" -type f -exec mv {} test_reports/ \;

      - name: Show consolidated test report
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: test_reports/report_*.xml
          check_name: TT-XLA ${{ needs.generate-matrix-test.outputs.test_matrix_name }}
          detailed_summary: true
          include_passed: ${{ inputs.include_passed }}
          group_suite: true
          token: ${{ github.token }}
