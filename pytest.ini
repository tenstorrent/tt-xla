[pytest]

;  https://github.com/tenstorrent/tt-xla/issues/2892, don't use long tracebacks
addopts = --tb=short

markers =
    push: marks tests as push, to be executed on PR pipeline
    nightly: marks tests as nightly, to be executed on nightly pipeline
    notimeout: marks tests that should use a default (240min) timeout instead of calculated duration
    model_test: marks test as model test, to be executed in a separate job in nightly tests
    large: marks model tests as large, to be executed in a separate runner with more resources
    # ModelTestStatus
    known_failure_xfail: Test is a known failure (marked xfail)
    not_supported_skip: Test is not supported on this architecture (marked skip)
    expected_passing: Test is expected to pass
    unspecified: Test has no status yet, needs triage
    placeholder: Test is a placeholder model for reporting purposes
    # RunMode
    inference: marks test as inference
    training: marks test as training
    # Parallelism
    single_device: marks test as single device
    data_parallel: marks test as data parallel
    tensor_parallel: marks test as tensor parallel
    # Multi-chip Configuration
    single_device: marks test for single device (wormhole_b0, p150)
    dual_chip: marks test for dual chip (n300)
    llmbox: marks test for llmbox (llmbox)
    galaxy: marks test for galaxy (galaxy)
    bh_galaxy: marks test for blackhole galaxy (galaxy-bh)
    # Multi-host Configuration
    multi_host_cluster: marks test for multi-host setups (llmbox)
    # FileCheck
    filecheck: marks test with FileCheck pattern files to validate generated MLIR
    # Cpu
    cpu: marks test as cpu
    # Perf benchmark hardware — maps to CI runner labels (see perf-bench-matrix.json).
    # Combine with a lane mark to select a grouped perf job, e.g. -m "n150 and nightly".
    n150: perf benchmark runs on the n150-perf runner
    p150: perf benchmark runs on the p150-perf runner
    n300_llmbox: perf benchmark runs on the n300-llmbox runner
    galaxy_wh_6u: perf benchmark runs on the galaxy-wh-6u runner
    qb2_blackhole: perf benchmark runs on the qb2-blackhole runner
    # Perf benchmark workflow lanes. The perf and PR lanes reuse the `nightly` / `push`
    # marks above; these are the accuracy variants (experimental + PR accuracy jobs):
    nightly_accuracy: perf benchmark runs in the experimental (accuracy) workflow
    push_accuracy: perf benchmark runs in the PR accuracy job
